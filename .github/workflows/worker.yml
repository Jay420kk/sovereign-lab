name: lab-worker

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Worker budget in minutes (small value = quick test)"
        required: false
        default: "300"
  push:
    branches: [main]
    paths:
      - "evolve/**"
      - "math-discovery/**"
      - "worker.py"
      - "gen_page.py"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: lab-worker
  cancel-in-progress: true

jobs:
  island:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Run lab worker island
        env:
          BUDGET: ${{ inputs.budget_min }}
        run: python3 worker.py "${BUDGET:-300}"

      - name: Build status page
        run: python3 gen_page.py

      - name: Commit results
        run: |
          if git diff --quiet -- logs docs; then
            echo "no changes"
            exit 0
          fi
          PEAK=$(python3 -c 'import json; print(round(json.load(open("logs/evolve_scores.json"))["peak"], 4))' 2>/dev/null || echo "?")
          git config user.name "sovereign-lab worker"
          git config user.email "worker@users.noreply.github.com"
          git add logs docs
          git commit -m "island $(date -u +%Y-%m-%dT%H:%MZ) evolve peak=$PEAK"
          git push
